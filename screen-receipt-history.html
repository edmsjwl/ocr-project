<!--
  영수증 내역 (Receipt History) 화면

  ⚠️ 이번 작업은 Figma를 새로 조회하지 않고, 이 저장소의 docs/design-system/*.md와
  기존 screen-*.html / assets/만 근거로 구성했다. 각 블록 출처는 "파일명 → 컴포넌트명" 주석으로 표시했다.
  문서에 없어서 이번 화면에서만 임의로 정한 값은 "※미정의"로 표시했다.

  사용한 컴포넌트 매핑:
    - 현재 달 표시      → 03-layout.md → Page-title-date (Usage 메모에 "영수증 내역 페이지 타이틀에 사용됩니다"로 명시됨)
    - 날짜 조회 기능     → 04-actions-inputs.md → Date-picker-rangebox (시각적 표시만 구현, 내부 Bottom-sheet-datepicker
                          상호작용은 문서에 "[Figma에서 확인 불가]"로 남아 있어 실제 동작은 넣지 않았다 — placeholder)
    - 상태 필터/칩       → 03-layout.md → Tab-menu (실제 라벨 전체/대기/처리중/완료/반려. variant 이름과 라벨이
                          다르다는 "명명 불일치" 메모를 따라 라벨 텍스트만 사용)
    - 총 건 수 / 상태 안내 → 문서에 전용 컴포넌트가 없어 기존 타이포 토큰(Caption02, Button-text/XS)을 그대로
                          재사용해 구성했다(※미정의 레이아웃, 토큰 자체는 전부 기존 값)
    - 리스트 카드        → 05-containers-overlays.md → Card-item-receipt-list (screen-home.html의 .card-row와
                          동일 스펙 — 거기서 쓴 구현을 그대로 재사용)
    - 처리 상태 안내 모달 → 05-containers-overlays.md → Modal-영수증상태

  아이콘/카드뱃지 에셋은 전부 assets/README.md에 기록된, Figma에서 실제 export한 SVG를 그대로 쓴다.
  상태바 아이콘만 (다른 화면들과 동일하게) canonical node 미확인으로 인라인 SVG 근사치를 쓴다.

  데이터: "현재 달"을 2026년 9월로 가정했다(※미정의 — 실제 "오늘" 기준 월은 서비스 연동 시 결정 필요).
  screen-home.html 최근 내역 샘플 데이터와 날짜대를 맞췄다.
-->
<title>영수증 내역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* ---- Color — 01-foundation.md → Color(Semantic Light) ---- */
    --bg-alternative: #f1f3f4;   /* cool-neutral-10 */
    --bg-secondary: #ffffff;     /* common-0 */
    --bg-inverse: #434648;       /* cool-neutral-80 */
    --label-primary-normal: #222426;     /* cool-neutral-90 */
    --label-secondary-normal: #434648;   /* cool-neutral-80 */
    --label-secondary-selected: #8c9499; /* cool-neutral-60 */
    --label-secondary-weak: #a2a9ae;     /* cool-neutral-50 */
    --label-secondary-disabled: #babec2; /* cool-neutral-40 */
    --label-primary-alternative: #a2a9ae; /* cool-neutral-50 — Page-title-date 텍스트 색 */
    --foreground-brand-normal: #2a7fec;  /* clearBlue-60 */
    --clear-blue-5: #eff8ff;
    --cool-neutral-10: #f1f3f4;
    --nav-pill-bg: #ebeef0;      /* foreground/normal/selected */
    --nav-item-selected-bg: #f7f8f9; /* foreground/normal/normal */
    /* line 계열은 원색이 아니라 opacity를 얹은 값이다(01-foundation.md) */
    --line-normal-alternative: rgba(87, 94, 98, 0.08); /* Tab-menu border */
    --dimmer-weak: rgba(0, 0, 0, 0.32);

    --status-pending-subtle: #e1f5fe; --status-pending-normal: #03a9f4;
    --status-processing-subtle: #e8f5e9; --status-processing-normal: #43a047;
    --status-completed-subtle: #f1f3f4; --status-completed-normal: #8c9499;
    --status-rejected-subtle: #ffebee; --status-rejected-normal: #f44336;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: #e3e6e8;
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 375px; /* CLAUDE.md "iOS 375px 프레임 기준" */
    height: 812px;
    background: var(--bg-alternative);
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Status-bar — 03-layout.md → Status-bar, background=Alternative ---- */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-alternative);
  }
  .status-bar .time { font: 600 15px/1 'Pretendard'; color: var(--label-primary-normal); letter-spacing: -0.237px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---- Page-title-date — 03-layout.md → Page-title-date ----
     W232, padding X16/Y8, gap4("2026년"·"9월" 사이) */
  .page-title-date {
    flex-shrink: 0;
    padding: 8px 16px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    /* Body05/Semibold 15/22/-0.3%(실제 -0.045px) */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.045px;
    font-weight: 600;
    color: var(--label-primary-alternative);
  }

  /* ---- Date-picker-rangebox — 04-actions-inputs.md → Date-picker-rangebox ----
     W335×H44(고정), radius14, border1px 불투명 label/secondary/normal, padding X16/Y12 */
  .rangebox-wrap { flex-shrink: 0; padding: 0 20px 12px; } /* ※미정의: 좌우 여백은 W335 맞추기 위한 20px */
  .rangebox {
    width: 100%;
    height: 44px;
    border-radius: 14px;
    border: 1px solid var(--label-secondary-normal);
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    cursor: pointer;
  }
  .rangebox .leading { display: flex; align-items: center; gap: 8px; }
  .rangebox .leading img { width: 24px; height: 24px; display: block; }
  .rangebox .range-text {
    /* Body04/Medium 16/24/-0.3%(실제 -0.048px) */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 500;
    color: var(--label-primary-normal);
  }
  .rangebox .trailing { border: none; background: none; padding: 0; display: flex; cursor: pointer; }
  .rangebox .trailing img { width: 20px; height: 20px; display: block; }

  /* ---- Tab-menu — 03-layout.md → Tab-menu / Tab-item ----
     W375, H41(Tab-item 40 + border-bottom1), padding X20, gap32 */
  .tab-menu {
    flex-shrink: 0;
    display: flex;
    gap: 32px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line-normal-alternative);
  }
  .tab-item {
    height: 40px;
    padding: 8px 2px;
    border: none;
    background: none;
    cursor: pointer;
    /* Body04/Bold 16/24/-0.3%(실제 -0.048px) */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 700;
    color: var(--label-secondary-disabled);
    border-bottom: 2px solid transparent;
  }
  .tab-item.active {
    color: var(--label-secondary-normal);
    border-bottom-color: var(--label-primary-normal);
  }

  /* ---- 총 건 수 + 상태 안내 — 문서에 전용 컴포넌트 없음(※미정의 레이아웃, 토큰은 기존 값 재사용) ---- */
  .meta-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
  }
  .total-count {
    margin: 0;
    /* Caption02/Semibold 12/18/-0.2%(실제 -0.024px) — 03-layout.md Tab-menu 주변 보조 텍스트와 동일 톤 */
    font-size: 12px;
    line-height: 18px;
    letter-spacing: -0.024px;
    font-weight: 600;
    color: var(--label-secondary-selected);
  }
  .status-info-btn {
    display: flex;
    align-items: center;
    gap: 4px; /* ※미정의: Button-text 공통 아이콘-라벨 gap 추정 */
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    /* Button-text/XS — 04-actions-inputs.md → Button-text: Body06/Semibold 14/20/-0.3%(실제 -0.042px) */
    font-size: 14px;
    line-height: 20px;
    letter-spacing: -0.042px;
    font-weight: 600;
    color: var(--label-secondary-normal);
  }
  .status-info-btn img { width: 16px; height: 16px; display: block; }

  /* ---- 리스트 ---- */
  .list { flex: 1; overflow-y: auto; }

  .month-group + .month-group { margin-top: 20px; } /* ※미정의 */
  .month-label {
    margin: 0;
    padding: 4px 20px 8px;
    /* Caption02/Semibold 12/18/-0.024px — screen-notifications.html .section-label과 동일 패턴 재사용 */
    font-size: 12px;
    line-height: 18px;
    letter-spacing: -0.024px;
    font-weight: 600;
    color: var(--label-secondary-selected);
  }

  /* ---- Card-item-receipt-list — 05-containers-overlays.md → Card-item-receipt-list
     (screen-home.html .card-row와 동일 스펙, 그대로 재사용) ---- */
  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 20px; /* ※미정의: 문서는 H49 고정값만 주므로, 리스트 행간 구분을 위해 상하 패딩으로 환산 */
    background: var(--bg-secondary);
    cursor: pointer;
  }
  .card-badge {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 3px 8px;
  }
  .card-badge.personal { background: var(--clear-blue-5); }
  .card-badge.corporate { background: var(--cool-neutral-10); }
  .card-badge img { width: 24px; height: 24px; display: block; }
  .card-badge span {
    font: 600 12px/18px 'Pretendard';
    letter-spacing: -0.024px;
  }
  .card-badge.personal span { color: var(--label-primary-normal); }
  .card-badge.corporate span { color: var(--label-secondary-normal); }

  .card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card-text .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card-text .merchant {
    font: 500 15px/22px 'Pretendard';
    letter-spacing: -0.045px;
    color: var(--label-secondary-normal);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-text .amount {
    font: 700 15px/22px 'Pretendard';
    letter-spacing: -0.045px;
    color: var(--label-primary-normal);
    white-space: nowrap;
  }
  .card-text .row2 { display: flex; align-items: center; justify-content: space-between; }
  .card-text .datetime {
    display: flex;
    gap: 6px;
    font: 500 14px/20px 'Pretendard';
    letter-spacing: -0.042px;
    color: var(--label-secondary-weak);
  }
  .status-chip {
    padding: 3px 6px;
    border-radius: 8px;
    font: 600 13px/19px 'Pretendard';
    letter-spacing: -0.026px;
  }
  .status-chip.pending { background: var(--status-pending-subtle); color: var(--status-pending-normal); }
  .status-chip.processing { background: var(--status-processing-subtle); color: var(--status-processing-normal); }
  .status-chip.completed { background: var(--status-completed-subtle); color: var(--status-completed-normal); }
  .status-chip.rejected { background: var(--status-rejected-subtle); color: var(--status-rejected-normal); }

  .empty-state {
    display: none;
    padding: 80px 24px;
    text-align: center;
    font-size: 16px;
    line-height: 24px;
    color: var(--label-secondary-disabled);
  }
  .empty-state.show { display: block; }

  /* ---- 하단 Nav — screen-home.html과 동일, "영수증 내역" 탭 활성 ---- */
  .nav-area { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .nav-bar {
    background: var(--nav-pill-bg);
    height: 69px;
    border-radius: 999px;
    padding: 6px;
    display: flex;
    align-items: center;
    box-shadow:
      1px 3px 3px rgba(69, 81, 90, 0.09),
      3px 7px 5px rgba(69, 81, 90, 0.03),
      5px 13px 6px rgba(69, 81, 90, 0.01),
      -1px -1px 10px rgba(69, 81, 90, 0.04);
  }
  .nav-item {
    width: 100px;
    height: 57px;
    border-radius: 999px;
    padding: 2px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: none;
    cursor: pointer;
    font-family: 'Pretendard';
  }
  .nav-item.active { background: var(--nav-item-selected-bg); }
  .nav-item span { font: 700 13px/19px 'Pretendard'; letter-spacing: -0.026px; }
  .nav-item.active span { color: var(--label-primary-normal); }
  .nav-item:not(.active) span { color: var(--label-secondary-weak); }
  .nav-item img { width: 24px; height: 24px; display: block; }

  .home-bar { display: flex; justify-content: center; padding: 16px 10px 6px; width: 100%; background: transparent; }
  .home-bar .slider { width: 134px; height: 5px; border-radius: 4px; background: var(--bg-inverse); }

  /* ---- Modal-영수증상태 — 05-containers-overlays.md → Modal-영수증상태 ----
     W311, radius20, padding-top24, Container gap16, 안쪽 그룹 gap28 */
  .dim {
    position: absolute;
    inset: 0;
    background: var(--dimmer-weak);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .dim.show { display: flex; }
  .status-modal {
    width: 311px;
    background: var(--bg-secondary);
    border-radius: 20px;
    box-shadow: 0 0 5px rgba(134, 134, 134, 0.32);
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .status-modal .modal-title {
    margin: 0;
    padding: 0 32px;
    text-align: center;
    /* Body02/Bold 20/28/-0.4%(실제 -0.08px) */
    font-size: 20px;
    line-height: 28px;
    letter-spacing: -0.08px;
    font-weight: 700;
    color: var(--label-primary-normal);
  }
  .status-modal .status-rows {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 20px;
  }
  .status-modal .status-row { display: flex; align-items: flex-start; gap: 10px; }
  .status-modal .status-row .badge-col { width: 50px; flex-shrink: 0; }
  .status-modal .status-row .badge {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 8px;
    /* Caption01/Semibold 13/19/-0.2%(실제 -0.026px) */
    font-size: 13px;
    line-height: 19px;
    letter-spacing: -0.026px;
    font-weight: 600;
  }
  .status-modal .status-row .badge.rejected { background: var(--status-rejected-subtle); color: var(--status-rejected-normal); }
  .status-modal .status-row .badge.pending { background: var(--status-pending-subtle); color: var(--status-pending-normal); }
  .status-modal .status-row .badge.processing { background: var(--status-processing-subtle); color: var(--status-processing-normal); }
  .status-modal .status-row .badge.completed { background: #f1f3f4; color: #575e62; }
  .status-modal .status-row .desc {
    padding: 0 3px;
    /* Body05/Medium 15/22/-0.3%(실제 -0.045px) */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.045px;
    font-weight: 500;
    color: var(--label-secondary-normal);
  }
  .status-modal .modal-action { padding: 10px 20px 20px; }
  .status-modal .close-btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: var(--foreground-brand-normal);
    color: #ffffff;
    cursor: pointer;
    /* Body04/Semibold 16/24/-0.048px */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 600;
  }
</style>

<div class="frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#222426"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#222426"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#222426"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#222426"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.2C8.66 10.2 9.2 9.66 9.2 9C9.2 8.34 8.66 7.8 8 7.8C7.34 7.8 6.8 8.34 6.8 9C6.8 9.66 7.34 10.2 8 10.2Z" fill="#222426"/><path d="M4.6 6.6C5.5 5.7 6.7 5.2 8 5.2C9.3 5.2 10.5 5.7 11.4 6.6" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M1.8 3.8C3.5 2.1 5.7 1.2 8 1.2C10.3 1.2 12.5 2.1 14.2 3.8" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#222426"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#222426"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="#222426"/></svg>
    </span>
  </div>

  <div class="page-title-date">
    <span>2026년</span><span>9월</span>
  </div>

  <div class="rangebox-wrap">
    <button class="rangebox" type="button" onclick="onRangeboxClick()">
      <span class="leading">
        <img src="assets/icon-calendar-24.svg" alt="">
        <span class="range-text" id="rangeText">26.08.01 ~ 26.09.30</span>
      </span>
      <span class="trailing" onclick="resetRange(event)" role="button" aria-label="기간 초기화">
        <img src="assets/icon-close-circle-solid-20.svg" alt="">
      </span>
    </button>
  </div>

  <div class="tab-menu" id="tabMenu">
    <button class="tab-item active" data-status="all" type="button">전체</button>
    <button class="tab-item" data-status="pending" type="button">대기</button>
    <button class="tab-item" data-status="processing" type="button">처리중</button>
    <button class="tab-item" data-status="completed" type="button">완료</button>
    <button class="tab-item" data-status="rejected" type="button">반려</button>
  </div>

  <div class="meta-row">
    <p class="total-count" id="totalCount">총 0건</p>
    <button class="status-info-btn" type="button" onclick="openStatusModal()">
      <img src="assets/icon-alert-circle-16.svg" alt="">
      상태 안내
    </button>
  </div>

  <div class="list" id="list"></div>
  <p class="empty-state" id="emptyState">해당 조건의 영수증 내역이 없습니다.</p>

  <div class="nav-area">
    <div class="nav-bar">
      <button class="nav-item" type="button" onclick="location.href='screen-home.html'">
        <img src="assets/nav-home-disabled-24.svg" alt="">
        <span>홈</span>
      </button>
      <button class="nav-item active" type="button">
        <img src="assets/nav-list-activated-24.svg" alt="">
        <span>영수증 내역</span>
      </button>
    </div>
    <div class="home-bar"><div class="slider"></div></div>
  </div>

  <div class="dim" id="statusDim" onclick="if(event.target===this) closeStatusModal()">
    <div class="status-modal">
      <p class="modal-title">영수증 상태</p>
      <div class="status-rows">
        <div class="status-row">
          <span class="badge-col"><span class="badge rejected">반려</span></span>
          <span class="desc">반려된 내역입니다. 상세에서 사유를 확인할 수 있습니다.</span>
        </div>
        <div class="status-row">
          <span class="badge-col"><span class="badge pending">대기</span></span>
          <span class="desc">증빙으로 사용되기 전이며 수정할 수 있습니다.</span>
        </div>
        <div class="status-row">
          <span class="badge-col"><span class="badge processing">처리중</span></span>
          <span class="desc">증빙으로 사용되어 수정할 수 없습니다.</span>
        </div>
        <div class="status-row">
          <span class="badge-col"><span class="badge completed">완료</span></span>
          <span class="desc">정산이 완료된 내역입니다.</span>
        </div>
      </div>
      <div class="modal-action">
        <button class="close-btn" type="button" onclick="closeStatusModal()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
  const CARD_ICON = {
    personal: '<img src="assets/card-personal-light-24.svg" alt="">',
    corporate: '<img src="assets/card-coporate-light-24.svg" alt="">'
  };
  const STATUS_LABEL = { pending: '대기', processing: '처리중', completed: '완료', rejected: '반려' };

  // screen-home.html 최근 내역 샘플과 날짜대를 맞춘 2개월치 데이터(※미정의: 서비스 연동 전 임시 데이터)
  const rows = [
    { month: '2026.09', card: 'personal',  merchant: '스타벅스목동SBS점', amount: '128,000', date: '09.18', time: '15:00', status: 'pending' },
    { month: '2026.09', card: 'personal',  merchant: '스타벅스목동SBS점', amount: '128,000', date: '09.18', time: '15:00', status: 'processing' },
    { month: '2026.09', card: 'corporate', merchant: '스타벅스목동SBS점', amount: '128,000', date: '09.18', time: '15:00', status: 'completed' },
    { month: '2026.09', card: 'corporate', merchant: '이마트 용산점',     amount: '54,200',  date: '09.17', time: '11:20', status: 'rejected' },
    { month: '2026.09', card: 'personal',  merchant: '교보문고 강남점',   amount: '32,000',  date: '09.16', time: '18:05', status: 'completed' },
    { month: '2026.08', card: 'corporate', merchant: '스타벅스목동SBS점', amount: '128,000', date: '08.29', time: '09:40', status: 'rejected' },
    { month: '2026.08', card: 'personal',  merchant: 'GS25 여의도점',    amount: '8,900',   date: '08.12', time: '08:15', status: 'completed' },
    { month: '2026.08', card: 'corporate', merchant: '교촌치킨 본사점',   amount: '21,000',  date: '08.05', time: '19:30', status: 'completed' },
  ];

  let activeStatus = 'all';

  function render() {
    const filtered = activeStatus === 'all' ? rows : rows.filter(r => r.status === activeStatus);

    document.getElementById('totalCount').textContent = `총 ${filtered.length}건`;

    const list = document.getElementById('list');
    const emptyState = document.getElementById('emptyState');
    list.innerHTML = '';

    if (filtered.length === 0) {
      emptyState.classList.add('show');
      return;
    }
    emptyState.classList.remove('show');

    // month 내림차순(최신 달 먼저), 월별로 그룹핑 — "각 달에 맞는 내역 리스트 카드"
    const months = [...new Set(filtered.map(r => r.month))].sort().reverse();

    months.forEach(month => {
      const [y, m] = month.split('.');
      const group = document.createElement('div');
      group.className = 'month-group';

      const label = document.createElement('p');
      label.className = 'month-label';
      label.textContent = `${y}년 ${Number(m)}월`;
      group.appendChild(label);

      filtered.filter(r => r.month === month).forEach(r => {
        const row = document.createElement('div');
        row.className = 'card-row';
        row.innerHTML = `
          <div class="card-badge ${r.card}">
            ${CARD_ICON[r.card]}
            <span>${r.card === 'personal' ? '개인' : '법인'}</span>
          </div>
          <div class="card-text">
            <div class="row1">
              <span class="merchant">${r.merchant}</span>
              <span class="amount">${r.amount}원</span>
            </div>
            <div class="row2">
              <span class="datetime"><span>${r.date}</span><span>${r.time}</span></span>
              <span class="status-chip ${r.status}">${STATUS_LABEL[r.status]}</span>
            </div>
          </div>
        `;
        group.appendChild(row);
      });

      list.appendChild(group);
    });
  }

  document.getElementById('tabMenu').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-item');
    if (!btn) return;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = btn.dataset.status;
    render();
  });

  function onRangeboxClick() {
    // 04-actions-inputs.md: Bottom-sheet-datepicker 내부 상호작용 스펙은 "[Figma에서 확인 불가]" —
    // 실제 동작(달력 바텀시트 열기)은 구현하지 않고 자리만 둔다.
    console.log('날짜 조회 — Bottom-sheet-datepicker 연결 필요(※미정의, 문서에 내부 스펙 없음)');
  }

  function resetRange(e) {
    e.stopPropagation();
    document.getElementById('rangeText').textContent = '26.08.01 ~ 26.09.30';
  }

  function openStatusModal() { document.getElementById('statusDim').classList.add('show'); }
  function closeStatusModal() { document.getElementById('statusDim').classList.remove('show'); }

  render();
</script>
