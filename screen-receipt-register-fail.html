<!--
  영수증 등록 실패 화면 — Figma "🟢 진행중" 페이지에서 조회한 실제 화면 구현.

  참조한 Figma 노드(fileKey ese9l01OJiDfirO8Q6XXIY):
    - SCR-02-005/영수증 등록/인식결과/실패   2082:117862 (Light)
    - Status-message-button(본문)           2082:117908
    - Img-warning/48(Color=red, 본 화면 인스턴스) 2312:84462

  Figma dev 주석(그대로 반영):
    1. 업로드한 영수증이 모두 인식에 실패했을 때 해당 화면이 나타난다.
    2. '확인' 버튼 선택 시 홈 화면으로 이동한다.

  구조: Status-bar(Secondary) + Status-message-button(아이콘·제목·설명·버튼 1개) 뿐이다.
  Header, 하단 Action-Area, Home-bar는 이 화면에 없다(실제 Figma 노드 트리에 존재하지 않음) —
  지난 버전에서 "화면당 주요 액션 1개" 원칙을 적용해 하단 Action-Area를 임의로 추가했던 것은
  실제 Figma와 다른 추측이었다. 이번에는 실제 노드 구조 그대로, 버튼 1개(확인)만 둔다.

  경고 아이콘(Img-warning/48, Color=red)은 download_assets로 이 화면 인스턴스를 직접 export해서
  얻은 실제 path를 그대로 옮겨왔다 — 삼각형 채움 #FF5252, 테두리·느낌표는 label/primary/normal
  (#222426)이다. 이 레드는 01-foundation.md의 status/rejected/normal(#F44336)과는 다른 값인데,
  이번에 처음 실측된 값이라 02-icon.md의 "[Figma에서 확인 불가]" 표시를 갱신해야 한다(별도 처리).

  상태바 아이콘(Celluar/Wi-Fi/Battery)은 Figma 에셋 URL이 7일 후 만료되어 저장소에 직접 링크할 수
  없으므로, 기존 screen-*.html 파일들과 동일하게 인라인 SVG로 재현했다.
-->
<title>영수증 등록 실패</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* ---- Color — 01-foundation.md → Color(Semantic Light) ---- */
    --bg-secondary: #ffffff;
    --static-white: #ffffff;
    --label-primary-normal: #222426;   /* 아이콘 테두리·느낌표 */
    --label-secondary-normal: #434648; /* 제목, 버튼 텍스트 */
    --label-secondary-selected: #8c9499; /* 설명 */
    /* line-normal 계열은 원색이 아니라 cool-neutral-70에 opacity를 얹은 값이다(01-foundation.md) */
    --line-normal-neutral: rgba(87, 94, 98, 0.16); /* cool-neutral-70 opacity 16% */
    /* Img-warning/48(Color=red) 삼각형 채움 — 이번에 Figma에서 처음 실측(기존 status-rejected 토큰과 다름) */
    --icon-warning-red: #ff5252;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: #e3e6e8;
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 375px; /* CLAUDE.md "iOS 375px 프레임 기준" */
    height: 812px;
    background: var(--bg-secondary); /* 루트 bg — Figma: bg-[...bg-secondary,white] */
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Status-bar — background=Secondary, label=Black(03-layout.md → Status-bar) ---- */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-secondary);
  }
  .status-bar .time { font: 600 15px/1 'Pretendard'; color: var(--label-primary-normal); letter-spacing: -0.237px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---- 본문 wrapper — Figma: px-20 py-160, top-44, w-375 ---- */
  .content-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 160px 20px; /* Figma 그대로. 320px 패딩 + 본문으로 화면 하단에 여백이 남는 레이아웃이 맞다 */
  }

  /* ---- Status-message-button — 03-layout.md → Status-message(button 변형) ----
     W343, padding Y80/X20, gap20(아이콘그룹↔버튼), 내부 title/desc 그룹 gap24 → gap6 */
  .status-message-button {
    width: 343px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 80px 20px;
  }
  .status-message-button .icon-text-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
  }
  .warning-icon { width: 52px; height: 52px; flex-shrink: 0; }

  .status-message-button .text-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .status-message-button .title {
    margin: 0;
    /* Body02/Semibold 20/28/-0.4%(실제 -0.08px) */
    font-size: 20px;
    line-height: 28px;
    letter-spacing: -0.08px;
    font-weight: 600;
    color: var(--label-secondary-normal);
    text-align: center;
  }
  .status-message-button .desc {
    margin: 0;
    /* Body04/Medium 16/24/-0.3%(실제 -0.048px) */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 500;
    color: var(--label-secondary-selected);
    text-align: center;
  }

  /* ---- Button-solid(Assistive/Outlined/Medium) — 04-actions-inputs.md → Button-solid ----
     H44, radius12, padding X20/Y10, border1 line/normal/neutral */
  .status-message-button .confirm-btn {
    height: 44px;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid var(--line-normal-neutral);
    background: var(--static-white);
    cursor: pointer;
    /* Body05/Semibold 15/22/-0.3%(실제 -0.045px) */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.045px;
    font-weight: 600;
    color: var(--label-secondary-normal);
  }
</style>
