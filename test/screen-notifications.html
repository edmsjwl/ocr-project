<!--
  알림 내역 (Notification History) — OCR 영수증전자화 서비스

  ⚠️ 이 파일은 Figma/Figma MCP를 전혀 사용하지 않고, 오직 현재 저장소의 `DESIGN.md`
  텍스트만 참고해서 만들었다. `DESIGN.md`에 수치가 없는 부분은 아래 "미정의 값" 주석과
  대화창 정리에 별도로 표시했고, 그 값들은 최소한으로만(또는 아예) 사용하지 않았다.

  적용한 DESIGN.md 값의 출처는 각 CSS 규칙 옆 주석에 "§섹션" 형태로 표시했다.
  DESIGN.md에 없어서 이 파일에서만 임의로 정한 값은 "※미정의" 로 표시했다 — 확인 필요.
-->
<title>알림 내역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* ---- §1.1/§1.2 Color — Atomic 원시값 + Semantic(Light) 매핑 ---- */
    --bg-primary: #f7f8f9;             /* cool-neutral-5 → semantic bg-primary */
    --label-primary-normal: #222426;   /* cool-neutral-90 → semantic label-primary-normal */
    --label-primary-weak: #babec2;     /* cool-neutral-40 → semantic label-primary-weak */
    --label-secondary-normal: #434648; /* cool-neutral-80 → semantic label-secondary-normal */
    --label-secondary-selected: #8c9499;/* cool-neutral-60 → semantic label-secondary-selected */
    --label-secondary-weak: #a2a9ae;   /* cool-neutral-50 → semantic label-secondary-weak */
    --label-brand-normal: #2a7fec;     /* clearBlue-60 → semantic label-brand-normal / fg-brand-normal */

    /* Status 세트 — §1.2 "Status(pending/processing/completed/rejected)" normal 값 */
    --status-pending: #03a9f4;     /* skyBlue-50 */
    --status-processing: #43a047;  /* green-60 */
    --status-completed: #8c9499;   /* cool-neutral-60 */
    --status-rejected: #f44336;    /* red-50 */

    /* line-normal 계열은 원색이 아니라 cool-neutral-70에 opacity를 얹은 값이다(§1.2 주의사항) */
    --line-normal-alternative: rgba(87, 94, 98, 0.08); /* cool-neutral-70 opacity 8% */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: #e3e6e8;
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 375px; /* DESIGN.md에 명시된 값은 아님 — CLAUDE.md "iOS 375px 프레임 기준"을 그대로 따름 */
    height: 812px;
    background: var(--bg-primary);
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Status bar — §5 "Status-bar" h44px(raw), Background=Primary ---- */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px; /* ※미정의: Status-bar 내부 padding 수치는 DESIGN.md에 없음. 좌우 20px는 다른 화면(px `Padding/20`류)과 시각적 정렬을 맞추기 위한 자체 추정값 */
  }
  .status-bar .time { font: 600 15px/1 'Pretendard'; color: var(--label-primary-normal); }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---- Page header — §5 "Page-Title/large" px `Padding/24` py `Padding/16`, 타이틀 Body01/Semibold ---- */
  .page-header {
    flex-shrink: 0;
    padding: 16px 24px; /* §5 Page-Title/large: py Padding/16, px Padding/24 (명명 규칙상 16px/24px로 해석) */
  }
  .page-header h1 {
    margin: 0;
    /* §2 Typography — Body01: 22 / 32 / -0.4, weight Semibold(600) */
    font-size: 22px;
    line-height: 32px;
    letter-spacing: -0.4px;
    font-weight: 600;
    color: var(--label-primary-normal); /* §1.2 label-primary-normal — Page-Title 색상은 §1.2 기준으로 재확인하라는 DESIGN.md 지시를 따라 적용 */
  }

  /* ---- 알림 목록 ---- */
  .list { flex: 1; overflow-y: auto; }

  .section-label {
    /* §2 Caption02: 12 / 18 / -0.2, weight Semibold */
    font-size: 12px;
    line-height: 18px;
    letter-spacing: -0.2px;
    font-weight: 600;
    color: var(--label-secondary-selected); /* §1.2 label-secondary-selected */
    padding: 12px 24px 8px; /* ※미정의: 그룹 라벨 자체의 padding은 DESIGN.md에 없음 — Page-Title의 px24 관례만 가로 정렬에 맞춰 재사용 */
  }

  .notification-row {
    display: flex;
    align-items: flex-start;
    gap: 12px; /* ※미정의: 행 내부 gap. Padding/N 명명 규칙 추정값(12px) */
    padding: 14px 24px; /* ※미정의: 행 padding. DESIGN.md에 Card/List-item 수치가 없어 Padding 명명 규칙 추정값 사용 */
    border-bottom: 1px solid var(--line-normal-alternative); /* §1.2 Line(normal)-alternative = cool-neutral-70 opacity 8% */
    cursor: pointer;
    background: none;
  }
  .notification-row:last-child { border-bottom: none; }

  /* 상태 표시 — §4 Icon 사이즈 규칙(16/20/24/28px)의 20px 단계를 그대로 사용.
     단, 실제 아이콘 글리프는 DESIGN.md에 정의된 것이 없어 글리프 없이 상태색 원으로만 표시했다.
     원 색상은 §1.2 Status(pending/processing/completed/rejected)의 "-normal" 값을 그대로 사용. */
  .status-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .status-dot.pending { background: var(--status-pending); }
  .status-dot.processing { background: var(--status-processing); }
  .status-dot.completed { background: var(--status-completed); }
  .status-dot.rejected { background: var(--status-rejected); }

  .row-body { flex: 1; min-width: 0; }

  .row-top { display: flex; align-items: center; gap: 6px; }

  .row-title {
    /* §2 Typography — Body04: 16 / 24 / -0.3 */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.3px;
    font-weight: 600; /* Semibold — 안읽음 상태 */
    color: var(--label-primary-normal); /* §1.2 label-primary-normal */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .notification-row.read .row-title { font-weight: 500; } /* Medium — 읽음 상태로 전환 시 굵기만 낮춤(§2 Typography 굵기 축 재사용) */

  .unread-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--label-brand-normal); /* §1.2 fg-brand-normal / label-brand-normal */
    flex-shrink: 0;
  } /* ※미정의: 6px 크기 자체는 DESIGN.md에 없는 자체 추정값(Icon 최소 단계인 16px보다 작아 배지 전용 임시값) */

  .row-desc {
    /* §2 Typography — Body05: 15 / 22 / -0.3 */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.3px;
    font-weight: 400;
    color: var(--label-secondary-normal); /* §1.2 label-secondary-normal */
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .row-time {
    /* §2 Typography — Caption03: 11 / 16 / -0.2 */
    font-size: 11px;
    line-height: 16px;
    letter-spacing: -0.2px;
    font-weight: 400;
    color: var(--label-secondary-weak); /* §1.2 label-secondary-weak */
    margin-top: 6px; /* ※미정의: 자체 추정값 */
  }

  /* ---- 빈 상태 ---- */
  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 80px 24px;
    text-align: center;
  }
  .empty-state.show { display: flex; }
  .empty-state p {
    margin: 0;
    /* §2 Typography — Body04: 16 / 24 / -0.3 */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.3px;
    color: var(--label-primary-weak); /* §1.2 label-primary-weak */
  }

  /* ---- 하단 "모두 읽음으로 표시" 텍스트 액션 ---- */
  .mark-all {
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    padding: 12px 24px; /* ※미정의: 자체 추정값(Padding 명명 규칙) */
    border-top: 1px solid var(--line-normal-alternative); /* §1.2 Line(normal)-alternative */
  }
  .mark-all button {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    /* §2 Typography — Body04: 16 / 24 / -0.3, weight Semibold */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.3px;
    font-weight: 600;
    color: var(--label-brand-normal); /* §1.2 label-brand-normal */
  }
</style>

<div class="frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#222426"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#222426"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#222426"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#222426"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.2C8.66 10.2 9.2 9.66 9.2 9C9.2 8.34 8.66 7.8 8 7.8C7.34 7.8 6.8 8.34 6.8 9C6.8 9.66 7.34 10.2 8 10.2Z" fill="#222426"/><path d="M4.6 6.6C5.5 5.7 6.7 5.2 8 5.2C9.3 5.2 10.5 5.7 11.4 6.6" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M1.8 3.8C3.5 2.1 5.7 1.2 8 1.2C10.3 1.2 12.5 2.1 14.2 3.8" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#222426"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#222426"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="#222426"/></svg>
    </span>
  </div>

  <div class="page-header"><h1>알림</h1></div>

  <div class="list" id="list">
    <div class="section-label">오늘</div>

    <div class="notification-row" data-unread="true">
      <div class="status-dot completed"></div>
      <div class="row-body">
        <div class="row-top">
          <span class="row-title">영수증 인식이 완료됐어요</span>
          <span class="unread-dot"></span>
        </div>
        <div class="row-desc">스타벅스 강남점 · 12,500원 영수증의 OCR 인식이 완료되어 확인이 필요합니다.</div>
        <div class="row-time">오늘 · 14:21</div>
      </div>
    </div>

    <div class="notification-row" data-unread="true">
      <div class="status-dot pending"></div>
      <div class="row-body">
        <div class="row-top">
          <span class="row-title">휴대폰 인증번호가 도착했어요</span>
          <span class="unread-dot"></span>
        </div>
        <div class="row-desc">본인 확인을 위한 인증번호가 발송되었습니다. 3분 이내에 입력해 주세요.</div>
        <div class="row-time">오늘 · 11:02</div>
      </div>
    </div>

    <div class="section-label">이전</div>

    <div class="notification-row read">
      <div class="status-dot processing"></div>
      <div class="row-body">
        <div class="row-top"><span class="row-title">영수증이 처리중이에요</span></div>
        <div class="row-desc">이마트 용산점 영수증이 전표 처리 대기 중입니다.</div>
        <div class="row-time">어제 · 09:40</div>
      </div>
    </div>

    <div class="notification-row read">
      <div class="status-dot rejected"></div>
      <div class="row-body">
        <div class="row-top"><span class="row-title">중복 제출이 발견됐어요</span></div>
        <div class="row-desc">동일한 영수증이 이미 등록되어 있습니다. 내역에서 확인해 주세요.</div>
        <div class="row-time">3일 전 · 18:12</div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="emptyState"><p>알림이 없습니다.</p></div>

  <div class="mark-all">
    <button type="button" onclick="markAllRead()">모두 읽음으로 표시</button>
  </div>
</div>

<script>
  function markAllRead() {
    document.querySelectorAll('.notification-row').forEach(row => {
      row.classList.add('read');
      row.removeAttribute('data-unread');
      row.querySelector('.unread-dot')?.remove();
    });
  }

  document.querySelectorAll('.notification-row').forEach(row => {
    row.addEventListener('click', () => {
      row.classList.add('read');
      row.removeAttribute('data-unread');
      row.querySelector('.unread-dot')?.remove();
    });
  });
</script>
