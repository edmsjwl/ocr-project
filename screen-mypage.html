<!--
  마이페이지 — Figma에 아직 디자인이 없는 화면이다.

  ⚠️ phone-auth/home 화면과 달리 이 화면은 Figma의 실제 SCR 프레임을 그대로 옮긴 것이
  아니다. "🟢 진행중" 페이지를 확인했지만 온보딩/홈/내역/업로드 섹션만 있고 마이페이지는
  없었다 — 그래서 screen-home.html과 동일한 시각 언어(Status-bar/Header/Nav 패턴,
  색상·타이포 토큰)를 그대로 이어받아 DESIGN.md에 이미 정의된 컴포넌트 조합만으로
  구성했다. 새로운 색상/타이포/spacing 값은 만들지 않았다.

  임의로 판단해서 채운 부분(Figma 확인 전 가정):
    - 하단 네비게이션에 "마이페이지" 진입 탭이 없다 — 지금 확인된 nav는 홈/영수증내역
      2개뿐이라 그대로 유지했고, 이 화면에 실제로 어떻게 진입하는지는 정의돼 있지 않다.
    - 프로필 아바타: 사람 아이콘 asset을 export하지 못해서 이니셜 텍스트로 대체했다.
    - 메뉴 항목(계정정보/알림설정/공지사항/FAQ/버전정보/로그아웃)은 이 서비스 성격상
      통상적으로 들어가는 항목을 추정한 것 — Figma에 실제로 정의된 목록이 아니다.
-->
<title>마이페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --bg-alternative: #f1f3f4;
    --bg-secondary: #ffffff;
    --bg-inverse: #434648;
    --label-primary-normal: #222426;
    --label-secondary-normal: #434648;
    --label-secondary-selected: #8c9499;
    --label-secondary-weak: #a2a9ae;
    --label-brand-normal: #2a7fec;
    --status-rejected-normal: #f44336;
    --nav-pill-bg: #ebeef0;
    --nav-item-selected-bg: #f7f8f9;
    --line-normal-alternative: rgba(87, 94, 98, 0.08); /* DESIGN.md §1.2 line-normal-alternative */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: #e3e6e8;
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 375px;
    height: 812px;
    background: var(--bg-alternative);
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Status bar — DESIGN.md §5.2 ---- */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--bg-alternative);
  }
  .status-bar .time { font: 600 15px/1 'Pretendard'; color: var(--label-primary-normal); }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---- Header — DESIGN.md §5.4, type=Title, h56 ---- */
  .header {
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    background: var(--bg-alternative);
    position: relative;
  }
  .header h1 {
    margin: 0;
    font: 700 20px/28px 'Pretendard';
    letter-spacing: -0.08px;
    color: var(--label-primary-normal);
  }

  .body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---- 프로필 카드 — "최근 제출 내역"과 동일한 컨테이너 스타일(§ home 화면 참고) ---- */
  .profile-card {
    background: var(--bg-secondary);
    border-radius: 20px;
    box-shadow: 0 0 1.5px rgba(134, 134, 134, 0.04);
    padding: 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 999px;
    background: var(--label-brand-normal);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 18px/1 'Pretendard';
    flex-shrink: 0;
  }
  .profile-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .profile-info .name {
    font: 600 18px/26px 'Pretendard'; /* Body03/Semibold */
    letter-spacing: -0.054px;
    color: var(--label-primary-normal);
  }
  .profile-info .team {
    font: 500 15px/22px 'Pretendard'; /* Body05/Medium */
    letter-spacing: -0.045px;
    color: var(--label-secondary-normal);
  }
  .profile-edit {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
    font: 600 14px/20px 'Pretendard'; /* Body06/Semibold */
    letter-spacing: -0.042px;
    color: var(--label-brand-normal);
  }

  /* ---- 메뉴 리스트 컨테이너 — recent 컨테이너와 동일 스타일 ---- */
  .menu-group {
    background: var(--bg-secondary);
    border-radius: 20px;
    box-shadow: 0 0 1.5px rgba(134, 134, 134, 0.04);
    overflow: hidden;
  }
  .menu-group + .menu-group { margin-top: 0; }
  .menu-label {
    padding: 12px 16px 4px;
    font: 600 12px/18px 'Pretendard'; /* Caption02/Semibold */
    letter-spacing: -0.2px;
    color: var(--label-secondary-selected);
  }
  .menu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    border: none;
    background: none;
    cursor: pointer;
    text-align: left;
    border-bottom: 1px solid var(--line-normal-alternative);
  }
  .menu-row:last-child { border-bottom: none; }
  .menu-row .label {
    font: 500 16px/24px 'Pretendard'; /* Body04/Medium */
    letter-spacing: -0.048px;
    color: var(--label-primary-normal);
  }
  .menu-row.danger .label { color: var(--status-rejected-normal); }
  .menu-row .right { display: flex; align-items: center; gap: 6px; }
  .menu-row .meta {
    font: 500 15px/22px 'Pretendard';
    letter-spacing: -0.045px;
    color: var(--label-secondary-weak);
  }
  .menu-row img { width: 20px; height: 20px; display: block; }

  /* ---- 하단 Nav — screen-home.html과 동일 ---- */
  .nav-area { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .nav-bar {
    background: var(--nav-pill-bg);
    height: 69px;
    border-radius: 999px;
    padding: 6px;
    display: flex;
    align-items: center;
    box-shadow:
      1px 3px 3px rgba(69, 81, 90, 0.09),
      3px 7px 5px rgba(69, 81, 90, 0.03),
      5px 13px 6px rgba(69, 81, 90, 0.01),
      -1px -1px 10px rgba(69, 81, 90, 0.04);
  }
  .nav-item {
    width: 100px;
    height: 57px;
    border-radius: 999px;
    padding: 2px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: none;
    cursor: pointer;
    font-family: 'Pretendard';
  }
  .nav-item.active { background: var(--nav-item-selected-bg); }
  .nav-item span { font: 700 13px/19px 'Pretendard'; letter-spacing: -0.026px; }
  .nav-item.active span { color: var(--label-primary-normal); }
  .nav-item:not(.active) span { color: var(--label-secondary-weak); }
  .nav-item img { width: 24px; height: 24px; display: block; }

  .home-bar { display: flex; justify-content: center; padding: 16px 10px 6px; width: 100%; }
  .home-bar .slider { width: 134px; height: 5px; border-radius: 4px; background: var(--bg-inverse); }
</style>

<div class="frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#222426"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#222426"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#222426"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#222426"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.2C8.66 10.2 9.2 9.66 9.2 9C9.2 8.34 8.66 7.8 8 7.8C7.34 7.8 6.8 8.34 6.8 9C6.8 9.66 7.34 10.2 8 10.2Z" fill="#222426"/><path d="M4.6 6.6C5.5 5.7 6.7 5.2 8 5.2C9.3 5.2 10.5 5.7 11.4 6.6" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M1.8 3.8C3.5 2.1 5.7 1.2 8 1.2C10.3 1.2 12.5 2.1 14.2 3.8" stroke="#222426" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#222426"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#222426"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="#222426"/></svg>
    </span>
  </div>

  <div class="header"><h1>마이페이지</h1></div>

  <div class="body">
    <div class="profile-card">
      <div class="avatar">김OO</div>
      <div class="profile-info">
        <span class="name">김은지</span>
        <span class="team">SBS 예능국 · 개인카드</span>
      </div>
      <button class="profile-edit" type="button">수정</button>
    </div>

    <div class="menu-group">
      <div class="menu-label">계정</div>
      <button class="menu-row" type="button">
        <span class="label">계정 정보 관리</span>
        <img src="assets/icon-chevron-right-20.svg" alt="">
      </button>
      <button class="menu-row" type="button">
        <span class="label">알림 설정</span>
        <img src="assets/icon-chevron-right-20.svg" alt="">
      </button>
    </div>

    <div class="menu-group">
      <div class="menu-label">고객지원</div>
      <button class="menu-row" type="button">
        <span class="label">공지사항</span>
        <img src="assets/icon-chevron-right-20.svg" alt="">
      </button>
      <button class="menu-row" type="button">
        <span class="label">자주 묻는 질문</span>
        <img src="assets/icon-chevron-right-20.svg" alt="">
      </button>
      <button class="menu-row" type="button">
        <span class="label">버전 정보</span>
        <span class="right">
          <span class="meta">1.0.0</span>
        </span>
      </button>
    </div>

    <div class="menu-group">
      <button class="menu-row danger" type="button">
        <span class="label">로그아웃</span>
      </button>
    </div>
  </div>

  <div class="nav-area">
    <div class="nav-bar">
      <button class="nav-item" type="button">
        <img src="assets/nav-home-disabled-24.svg" alt="">
        <span>홈</span>
      </button>
      <button class="nav-item" type="button">
        <img src="assets/nav-list-disabled-24.svg" alt="">
        <span>영수증 내역</span>
      </button>
    </div>
    <div class="home-bar"><div class="slider"></div></div>
  </div>
</div>
