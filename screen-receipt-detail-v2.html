<!--
  영수증 상세내역 (Receipt Detail) 화면 — v2 (Skills.md "UI Design Skill" 적용판)

  Skills.md가 이번에 저장되어 내용을 확인했다 — 디자인 시스템 규칙을 기계적으로 적용하지 말고
  정보를 Primary/Secondary/Status/Control로 분류해 위계·그룹핑·간격을 "판단"하라는 UI 설계
  기준이다. 이 기준으로 기존 구현(모든 필드를 동일 타이포·동일 간격으로 나열한 리스트)을
  재검토해 재설계했다. Figma는 조회하지 않고 docs/design-system/*.md의 기존 토큰만 재사용했다
  (Skill 자체가 "Skill에서 새로운 스타일 값을 정의하지 않는다"고 명시한다).

  [구현 전 설계 결정 — Skills.md §4]
    1. 화면 목적/행동: 제출한 영수증 1건의 처리 결과를 확인하고, 필요하면 삭제·수정한다.
    2. 정보 우선순위/그룹핑:
       - Primary(헤드라인): 가맹점명 + 사용금액 — 사용자가 가장 먼저 찾는 "무엇을 얼마에" 정보
       - Status: 처리상태 배지 — 헤드라인 바로 위에서 빠르게 스캔되도록 유지
       - Secondary(메타): 카드구분·프로그램·승인번호·승인일시 — 조회/증빙용 참고 정보라 2열 그리드로 압축
       - 적요는 메타 그리드와 성격이 달라(자유 서술형 텍스트) 별도 블록으로 분리
       - Control: 돋보기(확대), 삭제/수정하기 — 기존과 동일하되 삭제/수정은 여전히 반려·대기 상태에서만 노출
    3. 컴포넌트/레이아웃: 기존 Content-badge/Category-badge/Image-viewer/Action-Area 매핑은 유지하고,
       "상세 필드 리스트"만 균일한 1열 리스트 → 헤드라인 / 메타 그리드(2열) / 적요 블록 3단으로 재구성
    4. 시각적 위계/밀도: 가맹점명·금액만 크고 굵게(Body03/Semibold, Heading03/Bold)써서 먼저 읽히게 하고,
       메타 4항목은 더 작은 톤(Caption02 라벨 + Body05 값)으로 낮춰 압축했다. 간격도 그룹별로 다르게
       줬다(헤드라인 내부는 촘촘히, 그룹 사이는 구분선 + 여백으로 분리) — 전부 동일 gap을 쓰지 않았다.

  사용한 컴포넌트 매핑:
    - Header(뒤로가기)        → layout.md → Header, type=Back
    - 썸네일 + 돋보기          → containers-overlays.md → Image-viewer-343*140(Size=M)
    - 처리상태 배지            → display-feedback.md → Content-badge(Size=Large)
    - 카드 구분 배지           → display-feedback.md → Category-badge(Round)
    - 가맹점명/금액(헤드라인)   → foundation.md Typography의 Body03/Semibold(18/26), Heading03/Bold(24/34)를
                               재사용 — "금액 전용 색"이나 새 사이즈를 만들지 않고 기존 스케일 중 더 큰 것을 골랐다
    - 메타 그리드(카드구분/프로그램/승인번호/승인일시) → 전용 컴포넌트 없음(※미정의 레이아웃), 라벨은
      Caption02(12/18), 값은 Body05/Medium(15/22) — 기존 리스트보다 한 단계 낮은 기존 토큰으로 축소
    - 적요 블록               → Body04/Medium(16/24) 그대로, 헤드라인·메타와 분리된 별도 섹션으로 구성
    - 전체 카드 컨테이너       → 문서에 전용 "Detail-card" 컴포넌트가 없어, foundation.md Elevation의
                               `drop-shadow(0 0 1.5px rgba(134,134,134,0.04))`(Button-action-card·Skeleton에 쓰이는
                               것과 동일한 값)를 가져와 카드 셸을 구성했다(※미정의 카드 자체, 그림자 값은 기존 값)
    - 삭제 / 수정하기 CTA      → display-feedback.md → Action-Area(Color=White, Two-button, Normal) 그대로 재사용
      (반려/대기 상태일 때만 노출. "삭제"를 위험색으로 강조하는 별도 토큰은 문서에 없어서 임의로
      빨간 버튼을 만들지 않았고, 기존 Two-button 레시피(Outlined+Solid)를 그대로 썼다)
    - 관리자 문의 안내문       → "중요하지 않다"는 요청에 맞춰 Textfield Description(helper) 토큰
                               (Body06/Medium 14/20/-0.042px label/secondary/selected)을 재사용해 가장 낮은
                               시각 우선순위로 처리했다

  [결과 검토 — Skills.md §5, 브라우저로 렌더링 확인 완료]
    - 정보구조: 헤드라인(가맹점명·금액) → 상태 → 메타 4항목 → 적요 → 관리자 안내 순으로 중요도 내림차순 배치
    - 레이아웃: 메타 4항목은 반복 구조라 2열 그리드로 정렬축을 맞춤
    - 시각적 위계: 금액이 화면에서 가장 큰 텍스트가 되도록 조정(기존엔 다른 필드와 동일 크기였음)
    - 간격/밀도: 그룹 내부 gap(8~10px)과 그룹 사이 gap(구분선+20px)을 다르게 둬서 기계적 균등 간격을 피함
    - 디자인 시스템 준수: 새 색상·새 타이포 사이즈를 만들지 않고 기존 토큰 재조합만으로 위계를 표현

  영수증 이미지는 실제 사진 데이터가 없어 회색 placeholder로 대체했다(디자인 시스템 에셋이 아니라 런타임
  데이터이므로 가짜 벡터를 만들지 않고 정직하게 placeholder로 표시).
-->
<title>영수증 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    /* ---- Color — foundation.md → Color(Semantic Light) ---- */
    --bg-primary: #f7f8f9;
    --bg-secondary: #ffffff;
    --bg-inverse: #434648;
    --label-primary-normal: #222426;
    --label-secondary-normal: #434648;
    --label-secondary-selected: #8c9499;
    --label-secondary-weak: #a2a9ae;
    --label-inverse: #ffffff;
    --foreground-brand-normal: #2a7fec;
    --clear-blue-5: #eff8ff;
    --cool-neutral-10: #f1f3f4;
    --line-normal-neutral: rgba(87, 94, 98, 0.16);
    --line-normal-normal: rgba(87, 94, 98, 0.24);

    --status-pending-subtle: #e1f5fe; --status-pending-normal: #03a9f4;
    --status-processing-subtle: #e8f5e9; --status-processing-normal: #43a047;
    --status-completed-subtle: #f1f3f4; --status-completed-normal: #8c9499;
    --status-rejected-subtle: #ffebee; --status-rejected-normal: #f44336;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: #e3e6e8;
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 375px; /* CLAUDE.md "iOS 375px 프레임 기준" */
    height: 812px;
    background: var(--bg-primary);
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* ---- Status-bar — layout.md → Status-bar, background=Primary ---- */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .status-bar .time { font: 600 15px/1 'Pretendard'; color: var(--label-primary-normal); letter-spacing: -0.237px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* ---- Header — layout.md → Header, type=Back, background=Primary ----
     W375×H56, padding X20/Y16. 좌측 chevron-left/24 + 제목, gap4(내부 3). 제목 Body03/Semibold -0.054px */
  .header {
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 16px 20px;
  }
  .header .back-btn { border: none; background: none; padding: 0; cursor: pointer; display: flex; }
  .header .back-btn img { width: 24px; height: 24px; display: block; }
  .header .header-title {
    font: 600 18px/26px 'Pretendard';
    letter-spacing: -0.054px;
    color: var(--label-primary-normal);
  }

  .body { flex: 1; overflow-y: auto; padding: 4px 16px 20px; }

  /* ---- 상세 카드 컨테이너 — ※미정의 전용 컴포넌트, Elevation의 Button-action-card 그림자 재사용 ---- */
  .detail-card {
    background: var(--bg-secondary);
    border-radius: 20px;
    box-shadow: 0 0 1.5px rgba(134, 134, 134, 0.04);
    overflow: hidden;
  }

  /* ---- Image-viewer-343*140(M) — containers-overlays.md ----
     W343×H140, radius20, border1px line/normal/normal. 우측중앙 확대버튼 52×52(radius64, padding10, 아이콘24) */
  .thumbnail-viewer {
    position: relative;
    width: 100%;
    height: 140px;
    border-radius: 20px;
    border: 1px solid var(--line-normal-normal);
    overflow: hidden;
  }
  .thumbnail-viewer .placeholder-img {
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(135deg, #e8eaec 0 10px, #eef0f1 10px 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--label-secondary-weak);
  }
  .thumbnail-viewer .zoom-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 64px;
    padding: 10px;
    background: var(--bg-secondary);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 5px rgba(134, 134, 134, 0.2); /* ※미정의: 흰 버튼이 사진 위에서 보이도록 추가한 그림자 */
  }
  .thumbnail-viewer .zoom-btn img { width: 24px; height: 24px; display: block; }

  .card-inner { padding: 16px; }

  /* ---- 헤드라인(Primary) — 가맹점명+금액을 화면에서 가장 크게. Skills.md §3 "핵심 정보 우선 인지" ---- */
  .headline { padding: 4px 0 16px; }

  /* 처리상태 — display-feedback.md → Content-badge(Large). 헤드라인 위에서 빠르게 스캔되도록 배치 */
  .badge-large {
    display: inline-block;
    margin-bottom: 10px;
    padding: 6px 12px;
    border-radius: 10px;
    /* Body05/Bold 15/22/-0.3%(실제 -0.045px) */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.045px;
    font-weight: 700;
  }
  .badge-large.pending { background: var(--status-pending-subtle); color: var(--status-pending-normal); }
  .badge-large.processing { background: var(--status-processing-subtle); color: var(--status-processing-normal); }
  .badge-large.completed { background: var(--status-completed-subtle); color: var(--status-completed-normal); }
  .badge-large.rejected { background: var(--status-rejected-subtle); color: var(--status-rejected-normal); }

  .merchant-name {
    margin: 0;
    /* Body03/Semibold 18/26/-0.3%(실제 -0.054px) — foundation.md Typography */
    font-size: 18px;
    line-height: 26px;
    letter-spacing: -0.054px;
    font-weight: 600;
    color: var(--label-secondary-normal);
  }
  .amount-display {
    margin: 2px 0 0;
    /* Heading03/Bold 24/34/-0.4%(실제 -0.096px) — 기존 스케일 중 가장 큰 톤을 재사용해 금액을 강조 */
    font-size: 24px;
    line-height: 34px;
    letter-spacing: -0.096px;
    font-weight: 700;
    color: var(--label-primary-normal);
  }

  hr.divider { border: none; border-top: 1px solid var(--line-normal-neutral); margin: 0 0 16px; }

  /* ---- 메타 그리드(Secondary) — 카드구분/프로그램/승인번호/승인일시. 반복 구조라 2열로 압축 ----
     전용 컴포넌트 없음(※미정의 레이아웃). 헤드라인보다 한 단계 낮은 기존 토큰(Caption02/Body05)만 사용 */
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 16px;
    column-gap: 12px;
    padding-bottom: 16px;
  }
  .meta-cell { display: flex; flex-direction: column; gap: 4px; }
  .meta-cell .meta-label {
    /* Caption02/Semibold 12/18/-0.2%(실제 -0.024px) */
    font-size: 12px;
    line-height: 18px;
    letter-spacing: -0.024px;
    font-weight: 600;
    color: var(--label-secondary-selected);
  }
  .meta-cell .meta-value {
    /* Body05/Medium 15/22/-0.3%(실제 -0.045px) — 기존(Body04/16px)보다 한 단계 낮춤 */
    font-size: 15px;
    line-height: 22px;
    letter-spacing: -0.045px;
    font-weight: 500;
    color: var(--label-primary-normal);
  }

  .category-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 3px 8px;
    border-radius: 999px;
    /* Caption01/Semibold 13/19/-0.2%(실제 -0.026px) */
    font-size: 13px;
    line-height: 19px;
    letter-spacing: -0.026px;
    font-weight: 600;
  }
  .category-badge.personal { background: var(--clear-blue-5); color: var(--label-primary-normal); }
  .category-badge.corporate { background: var(--cool-neutral-10); color: var(--label-secondary-normal); }

  /* ---- 적요 — 메타 그리드와 성격이 다른 자유 서술형 텍스트라 별도 블록으로 분리 ---- */
  .memo-block {
    padding-top: 16px;
    border-top: 1px solid var(--line-normal-neutral);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .memo-block .memo-label {
    /* Body06/Medium 14/20/-0.042px — meta-label보다는 한 톤 높여 "항목"이 아닌 "섹션"임을 구분 */
    font-size: 14px;
    line-height: 20px;
    letter-spacing: -0.042px;
    font-weight: 500;
    color: var(--label-secondary-selected);
  }
  .memo-block .memo-text {
    margin: 0;
    /* Body04/Medium 16/24/-0.3%(실제 -0.048px) */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 500;
    color: var(--label-primary-normal);
  }

  /* ---- 관리자 문의 안내문 — 중요도 낮음 → Textfield Description(helper) 토큰 그대로 ---- */
  .admin-note {
    margin: 16px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line-normal-neutral);
    /* Body06/Medium 14/20/-0.3%(실제 -0.042px) */
    font-size: 14px;
    line-height: 20px;
    letter-spacing: -0.042px;
    font-weight: 500;
    color: var(--label-secondary-selected);
  }

  /* ---- Action-Area — display-feedback.md → Action-Area(Color=White/Two-button/Normal) ---- */
  .action-area {
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(247,248,249,0) 0.91%, rgba(247,248,249,0.53) 24.99%, var(--bg-primary) 50%);
  }
  .action-area .contents { display: flex; gap: 10px; padding: 10px 20px 20px; }
  .action-area button {
    flex: 1;
    height: 52px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    /* Body04/Semibold 16/24/-0.3%(실제 -0.048px) */
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.048px;
    font-weight: 600;
    padding: 14px 28px;
  }
  .action-area .alternative {
    background: var(--bg-secondary);
    border: 1px solid var(--line-normal-neutral);
    color: var(--label-secondary-normal);
  }
  .action-area .main {
    background: var(--foreground-brand-normal);
    color: var(--label-inverse);
  }
  .home-bar { display: flex; justify-content: center; padding: 16px 10px 6px; background: var(--bg-primary); }
  .home-bar .slider { width: 134px; height: 5px; border-radius: 4px; background: var(--bg-inverse); }
</style>

    <span class="icons">

<script>
  const STATUS_LABEL = { pending: '대기', processing: '처리중', completed: '완료', rejected: '반려' };
  const CARD_LABEL = { personal: '개인카드', corporate: '법인카드' };

  // ※미정의: 실제 데이터 연동 전 샘플. status를 pending/completed/processing/rejected로 바꿔보면
  // CTA(삭제·수정하기) 노출 조건("반려, 대기인 경우만")이 바로 확인된다.
  const receipt = { status: 'rejected', card: 'personal' };

  document.getElementById('statusBadge').textContent = STATUS_LABEL[receipt.status];
  document.getElementById('statusBadge').classList.add(receipt.status);

  document.getElementById('categoryBadge').textContent = CARD_LABEL[receipt.card];
  document.getElementById('categoryBadge').classList.add(receipt.card);

  const showCta = receipt.status === 'rejected' || receipt.status === 'pending';
  document.getElementById('actionArea').style.display = showCta ? '' : 'none';
</script>
